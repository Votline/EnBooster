services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    env_file:
      - .env
      - ./gateway/.env_vars
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      - redis_sm

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile
    env_file:
      - .env
      - ./users-service/.env_vars
    ports:
      - "${USERS_PORT}:${USERS_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  learn-service:
    build:
      context: .
      dockerfile: learn-service/Dockerfile
    env_file:
      - .env
      - ./learn-service/.env_vars
    ports:
      - "${LEARN_PORT}:${LEARN_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    env_file:
      - .env
    volumes:
      - ./users-service/init.sql:/docker-entrypoint-initdb.d/1-users.sql:ro
      - ./learn-service/init.sql:/docker-entrypoint-initdb.d/2-learn.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1 FROM users LIMIT 1;'"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 5s

  redis_sm:
    image: redis:alpine
    ports:
      - "${REDIS_SM_PORT}:${REDIS_PORT}"
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_SM_PASSWORD}"
      - "--loglevel warning"

  redis_lrn:
    image: redis:alpine
    ports:
      - "${REDIS_LRN_PORT}:${REDIS_PORT}"
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_LRN_PASSWORD}"
      - "--loglevel warning"

  redis_rl:
    image: redis:alpine
    ports:
      - "${REDIS_RL_PORT}:${REDIS_PORT}"
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_RL_PASSWORD}"
      - "--loglevel warning"

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '${KAFKA_VOTERS}'
      KAFKA_LISTENERS: '${KAFKA_LIS_1},${KAFKA_LIS_2}'
      KAFKA_ADVERTISED_LISTENERS: '${KAFKA_LIS_1}'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CLUSTER_ID: '${KAFKA_CLUSTER_ID}'
