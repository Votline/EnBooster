syntax = "proto3";

package ai;
option go_package = "generated-ai/;aiservice";

message GenerateTextReq {
  int64 uuid = 1;
  string text = 2;
  string request_trace = 3;
}
message GenerateTextRes {
  string text = 1;
}

service AIService {
  rpc GenerateText (GenerateTextReq) returns (GenerateTextRes);
}
