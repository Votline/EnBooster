apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      initContainers:
        - name: wait-for-kafka
          image: apache/kafka:3.7.0
          command:
            - sh
            - -c
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                    --command-config /etc/kafka-client/client.properties --list; do
                echo "Kafka ещё не готова, жду..."
                sleep 2
              done
              echo "Kafka готова"
          volumeMounts:
            - name: kafka-client-config
              mountPath: /etc/kafka-client/client.properties
              subPath: client.properties
            - name: kafka-truststore
              mountPath: /etc/kafka-client/kafka.truststore.p12
              subPath: kafka.truststore.p12
      containers:
      - name: users-service
        image: users-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 50051
        envFrom:
        - configMapRef:
            name: users-config
        volumeMounts:
          - name: kafka-ca-cert
            mountPath: /build/ssl/kafka.crt
            subPath: kafka.crt
      volumes:
        - name: kafka-ca-cert
          configMap:
            name: kafka-ca-cert
        - name: kafka-client-config
          configMap:
            name: kafka-client-config
        - name: kafka-truststore
          secret:
            secretName: kafka-keystore
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  selector:
    app: users-service
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
